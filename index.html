<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Навигатор по Складам WB</title>
    
    <link rel="icon" type="image/png" href="https://upload.wikimedia.org/wikipedia/commons/thumb/f/ff/Wildberries_logo_2021.svg/1200px-Wildberries_logo_2021.svg.png">
    <link rel="apple-touch-icon" href="https://upload.wikimedia.org/wikipedia/commons/thumb/f/ff/Wildberries_logo_2021.svg/1200px-Wildberries_logo_2021.svg.png">
    
    <meta name="theme-color" content="#0b0f19">

    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #151b2b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: rgba(255, 255, 255, 0.08);
            --border-hover: rgba(203, 17, 171, 0.4);
            --glass-header: rgba(11, 15, 25, 0.85);
            --tag-bg: rgba(255, 255, 255, 0.05);
            --tag-text: #cbd5e1;
            --wb-accent: #cb11ab;
            --wb-gradient: linear-gradient(135deg, #cb11ab 0%, #481173 100%);
            --shadow-hover: 0 12px 32px rgba(0, 0, 0, 0.4);
            --highlight-bg: rgba(203, 17, 171, 0.25);
            --inner-box-bg: rgba(255, 255, 255, 0.03);
        }

        [data-theme="light"] {
            --bg-color: #f1f5f9; 
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-color: rgba(0, 0, 0, 0.08);
            --border-hover: rgba(203, 17, 171, 0.3);
            --glass-header: rgba(241, 245, 249, 0.9);
            --tag-bg: rgba(15, 23, 42, 0.04);
            --tag-text: #475569;
            --shadow-hover: 0 12px 32px rgba(15, 23, 42, 0.08);
            --highlight-bg: rgba(203, 17, 171, 0.15);
            --inner-box-bg: rgba(0, 0, 0, 0.03);
        }

        body {
            background-color: var(--bg-color); 
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0; padding: 0; 
            -webkit-font-smoothing: antialiased;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(148, 163, 184, 0.2); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--wb-accent); }

        .container { display: block; max-width: 1400px; margin: 0 auto; animation: fadeIn 0.4s ease; }
        .content-padding { padding: 0 24px 60px 24px; }
        @media (min-width: 768px) { .content-padding { padding: 0 48px 60px 48px; } }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        .sticky-header {
            position: sticky; top: 0; z-index: 100;
            background: var(--glass-header); 
            backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
            padding: 24px 24px 16px 24px; border-bottom: 1px solid var(--border-color);
        }
        @media (min-width: 768px) { .sticky-header { padding: 32px 48px 16px 48px; } }

        .header-area { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 16px; margin-bottom: 24px; }
        .header-area h1 { margin: 0; font-size: 28px; font-weight: 800; }
        .header-actions { display: flex; gap: 12px; }

        .icon-btn, .share-btn {
            background: var(--card-bg); border: 1px solid var(--border-color); color: var(--text-main); 
            border-radius: 10px; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; justify-content: center;
        }
        .icon-btn { padding: 10px 14px; font-size: 18px; }
        .share-btn { background: var(--card-bg); font-weight: 600; font-size: 14px; padding: 10px 20px; gap: 8px; }
        .share-btn:hover { border-color: var(--wb-accent); color: var(--wb-accent); }

        .search-container { position: relative; margin-bottom: 20px; display: flex; align-items: center; }
        .search-container svg { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: var(--text-muted); width: 20px; height: 20px; }
        .search-container input { width: 100%; box-sizing: border-box; padding: 14px 20px 14px 48px; border-radius: 14px; border: 1px solid var(--border-color); background: var(--card-bg); color: var(--text-main); font-size: 16px; outline: none; }
        .search-container input:focus { border-color: var(--wb-accent); }
        
        .clear-btn { position: absolute; right: 16px; background: transparent; border: none; outline: none; color: var(--text-muted); font-size: 22px; cursor: pointer; display: none; width: 24px; height: 24px; }

        mark.highlight { background: var(--highlight-bg); color: inherit; border-radius: 3px; padding: 0 2px; }

        .nav-tabs { display: flex; gap: 4px; overflow-x: auto; border-bottom: 1px solid var(--border-color); }
        .nav-tabs::-webkit-scrollbar { display: none; }
        
        .tab-button { 
            background: transparent; border: none; outline: none; color: var(--text-muted); 
            padding: 12px 16px; margin-bottom: -1px; border-bottom: 2px solid transparent; 
            cursor: pointer; font-weight: 600; transition: all 0.2s; font-size: 14px; 
            white-space: nowrap; display: flex; align-items: center; gap: 8px;
        }
        .tab-button.active { color: var(--text-main); border-bottom-color: var(--wb-accent); }
        .tab-count { background: var(--border-color); color: var(--text-muted); padding: 2px 8px; border-radius: 100px; font-size: 11px; font-weight: 700; }
        .tab-button.active .tab-count { background: rgba(203, 17, 171, 0.15); color: var(--wb-accent); }

        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); gap: 24px; padding-top: 32px; }

        .card { 
            background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 18px; 
            padding: 22px; display: flex; flex-direction: column; 
            transition: all 0.25s ease; position: relative; overflow: hidden;
        }
        .card::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 5px; background-color: var(--card-status-color, #3b82f6); }
        
        .card.status-green { --card-status-color: #10b981; }
        .card.status-red { --card-status-color: #ef4444; }
        .card.status-yellow { --card-status-color: #f59e0b; }
        .card.status-blue { --card-status-color: #3b82f6; }

        .card:hover { transform: translateY(-3px); box-shadow: var(--shadow-hover); border-color: var(--border-hover); }

        .card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 14px; }
        .card-title-group { display: flex; flex-direction: column; gap: 4px; max-width: 82%; }
        .card h3 { margin: 0; font-size: 18px; font-weight: 800; line-height: 1.3; }
        .warehouse-id-badge { display: inline-block; font-size: 12px; font-weight: 700; color: var(--wb-accent); background: rgba(203, 17, 171, 0.12); padding: 2px 8px; border-radius: 6px; width: fit-content; }

        .fav-btn { background: transparent; border: none; cursor: pointer; font-size: 22px; color: var(--text-muted); opacity: 0.6; transition: all 0.2s; padding: 0; }
        .fav-btn:hover { opacity: 1; transform: scale(1.1); }
        .fav-btn.active { color: #f59e0b; opacity: 1; }

        .tags-row { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 16px; }
        .tag { background: var(--tag-bg); border: 1px solid var(--border-color); padding: 4px 10px; border-radius: 6px; font-size: 12px; font-weight: 600; color: var(--tag-text); }
        .tag-active { background: rgba(16, 185, 129, 0.1); color: #10b981; border-color: rgba(16, 185, 129, 0.2); }
        .tag-warning { background: rgba(245, 158, 11, 0.1); color: #f59e0b; border-color: rgba(245, 158, 11, 0.2); }

        .specs-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; background: var(--inner-box-bg); padding: 12px; border-radius: 12px; margin-bottom: 16px; border: 1px solid var(--border-color); }
        .spec-item { display: flex; flex-direction: column; font-size: 12px; }
        .spec-label { color: var(--text-muted); font-size: 11px; margin-bottom: 2px; }
        .spec-value { font-weight: 700; color: var(--text-main); }

        .address-box { font-size: 13px; color: var(--text-muted); line-height: 1.4; margin-bottom: 16px; display: flex; gap: 8px; align-items: flex-start; }
        .address-icon { font-size: 16px; flex-shrink: 0; margin-top: 1px; }

        .card-footer { border-top: 1px solid var(--border-color); padding-top: 14px; display: flex; justify-content: space-between; align-items: center; margin-top: auto; font-size: 13px; font-weight: 600; }
        .status-badge { display: flex; align-items: center; font-size: 12px; }
        .dot { width: 8px; height: 8px; border-radius: 50%; margin-right: 8px; }
        .status-green .dot { background: #10b981; box-shadow: 0 0 8px rgba(16,185,129,0.5); }
        .status-red .dot { background: #ef4444; box-shadow: 0 0 8px rgba(239,68,68,0.5); }
        .status-yellow .dot { background: #f59e0b; box-shadow: 0 0 8px rgba(245,158,11,0.5); }

        .route-btn { display: inline-flex; align-items: center; gap: 6px; background: var(--wb-gradient); color: white; border: none; padding: 8px 14px; border-radius: 8px; font-size: 12px; font-weight: 700; text-decoration: none; transition: opacity 0.2s; }
        .route-btn:hover { opacity: 0.9; }

        .empty-state { grid-column: 1 / -1; text-align: center; padding: 60px 20px; }
        .footer-copyright { text-align: center; margin-top: 60px; font-size: 11px; font-weight: 700; letter-spacing: 1.5px; color: var(--text-muted); opacity: 0.5; }

        #toast { position: fixed; bottom: -100px; left: 50%; transform: translateX(-50%); background: var(--text-main); color: var(--bg-color); padding: 12px 24px; border-radius: 100px; font-size: 14px; font-weight: 600; box-shadow: 0 10px 30px rgba(0,0,0,0.2); transition: bottom 0.4s ease; z-index: 2000; }
        #toast.show { bottom: 40px; }

        .iphone-error { border: 2px dashed #ef4444; padding: 20px; border-radius: 16px; background: rgba(239, 68, 68, 0.1); display: inline-block; max-width: 500px; margin: 0 auto; text-align: left; }
    </style>
</head>
<body>

<div class="container" id="mainContainer">
    <div class="sticky-header">
        <div class="header-area">
            <h1>🏬 Навигатор по складам</h1>
            <div class="header-actions">
                <button class="icon-btn" onclick="toggleTheme()" id="themeIcon">☀️</button>
                <button class="share-btn" onclick="shareApp()">Поделиться</button>
            </div>
        </div>
        <div class="search-container">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
            <input type="text" id="searchInput" placeholder="Поиск по названию, ID или адресу..." oninput="filterCards()">
            <button id="clearSearchBtn" class="clear-btn" onclick="clearSearch()">&times;</button>
        </div>
        <nav class="nav-tabs" id="tabsContainer"></nav>
    </div>

    <div class="content-padding">
        <!-- Экран начальной загрузки -->
        <main id="contentArea" class="grid">
             <div class="empty-state">
                <span style="font-size:48px; display:inline-block; animation: spin 1.5s linear infinite;">⏳</span>
                <h3>Подключение к базе данных...</h3>
                <p style="color: var(--text-muted); font-size: 14px;">Пожалуйста, подождите. Если загрузка идет долго, возможно, iOS блокирует скрипт.</p>
             </div>
        </main>
        <div class="footer-copyright">DEVELOPED BY D. MARTINKEVICH FOR WAREHOUSE NAVIGATOR</div>
    </div>
</div> 

<div id="toast">Уведомление</div>

<script>
const SHEET_ID = '1iZnxEpS-KkxqVZjI_C4dAM71nYpLfBuQagDE-rfY-xU'; 
const SHEET_NAME = 'Лист1'; 

let warehousesData = [];
let favorites = JSON.parse(localStorage.getItem('wb_wh_favorites_v3')) || [];
let currentTab = 'Все склады';
const tabsList = ['Все склады', 'Избранное'];

document.addEventListener("DOMContentLoaded", function() {
    initTheme();
    loadSheetData();
});

// Безопасная функция для извлечения ячеек
function getCellValue(row, colIndex) {
    if (!row || !row.c || colIndex >= row.c.length || row.c[colIndex] === null || row.c[colIndex] === undefined || row.c[colIndex].v === null || row.c[colIndex].v === undefined) {
        return '';
    }
    return String(row.c[colIndex].v);
}

function loadSheetData() {
    warehousesData = [];
    fetchSingleSheetData(SHEET_NAME, function(success) {
        if(success) {
            renderTabs();
            renderCards();
        }
    });
}

function fetchSingleSheetData(sheetName, callback) {
    const callbackName = 'handler_' + Math.random().toString(36).substr(2, 9);
    
    // Таймер, если файл открыли в предпросмотре iOS и интернет заблокирован
    let timeout = setTimeout(function() {
        const container = document.getElementById('contentArea');
        container.innerHTML = `
            <div class="empty-state" style="grid-column: 1 / -1;">
                <div class="iphone-error">
                    <h3 style="color: #ef4444; margin-top:0;">⚠️ Ошибка доступа к интернету</h3>
                    <p style="font-size: 14px; margin-bottom: 8px;"><b>Вы открыли файл в режиме предпросмотра внутри архива .zip или мессенджера (Telegram).</b></p>
                    <p style="font-size: 14px;">Apple iOS в целях безопасности блокирует загрузку данных (таблиц) в таком режиме.</p>
                    <hr style="border-color: rgba(239,68,68,0.3); margin: 16px 0;">
                    <p style="font-size: 14px; font-weight: bold;">Как это исправить:</p>
                    <ol style="font-size: 14px; margin-bottom: 0; padding-left: 20px;">
                        <li>Извлеките (распакуйте) файл из .zip архива.</li>
                        <li>Сохраните файл в приложение «Файлы» (Files) на iPhone.</li>
                        <li>Откройте приложение «Файлы», нажмите на этот HTML-файл долгим тапом.</li>
                        <li>Выберите <b>«Поделиться»</b> и затем <b>«Открыть в Safari»</b> (или другой полноценный браузер).</li>
                    </ol>
                </div>
            </div>
        `;
        callback(false);
    }, 4000); // 4 секунды ожидания

    window[callbackName] = function(data) {
        clearTimeout(timeout); // Отключаем таймер ошибки, так как данные пришли
        
        if (data && data.table && data.table.rows) {
            data.table.rows.forEach(function(row) {
                let title = getCellValue(row, 1).trim();
                
                // ИСПРАВЛЕНИЕ №1: Убрал проверку index === 0, чтобы Голицыно загрузилось.
                // Отсекаем только если это реально пустая строка или заголовок таблицы
                if (!title || title.toLowerCase() === 'склад' || title === '№' || title.toLowerCase() === 'название склада') return;

                let id1 = getCellValue(row, 2);
                let id2 = getCellValue(row, 3);
                let id3 = getCellValue(row, 4);
                let id4 = getCellValue(row, 5);
                let idsArr = [id1, id2, id3, id4].filter(function(v) { return v !== ''; });
                let whId = idsArr.length > 0 ? idsArr.join(', ') : 'N/A';

                let statusText = getCellValue(row, 6).trim() || 'Неизвестно';
                let statusColor = 'yellow';
                if (statusText.toLowerCase().indexOf('активен') !== -1) statusColor = 'green';
                if (statusText.toLowerCase().indexOf('закрыт') !== -1 || statusText.toLowerCase().indexOf('не активен') !== -1) statusColor = 'red';

                let fbs = getCellValue(row, 8).toLowerCase() === 'да';
                let fbo = getCellValue(row, 9).toLowerCase() === 'да';
                let brak = getCellValue(row, 10).toLowerCase() === 'да';

                let type = getCellValue(row, 11).trim() || '-';
                let ownership = getCellValue(row, 12).trim() || '-';
                let area = getCellValue(row, 13).trim() || '-';
                if (area !== '-' && area.indexOf('кв') === -1) area += ' кв.м';
                let gates = getCellValue(row, 16).trim() || '-';
                let address = getCellValue(row, 17).trim() || 'Адрес не указан';
                let pmRoutes = getCellValue(row, 18).trim();
                let mgRoutes = getCellValue(row, 19).trim();

                // ИСПРАВЛЕНИЕ №2: Объединяем все 3 колонки типов хранения (20, 21, 22)
                let st1 = getCellValue(row, 20).trim(); // Стеллажное
                let st2 = getCellValue(row, 21).trim(); // Напольное
                let st3 = getCellValue(row, 22).trim(); // Кламперное
                
                let activeStorageTypes = [];
                if (st1 && st1.toLowerCase() !== 'нет' && st1 !== 'nan' && st1 !== '0' && st1 !== '-') activeStorageTypes.push('Стеллажное');
                if (st2 && st2.toLowerCase() !== 'нет' && st2 !== 'nan' && st2 !== '0' && st2 !== '-') activeStorageTypes.push('Напольное');
                if (st3 && st3.toLowerCase() !== 'нет' && st3 !== 'nan' && st3 !== '0' && st3 !== '-') activeStorageTypes.push('Кламперное');
                
                let storageType = activeStorageTypes.length > 0 ? activeStorageTypes.join(', ') : '';
                let storagePlaces = getCellValue(row, 23).trim();

                warehousesData.push({
                    id: 'wh_' + Math.random().toString(36).substr(2, 9),
                    title: title, whId: whId, statusColor: statusColor, statusText: statusText,
                    type: type, ownership: ownership, fbs: fbs, fbo: fbo, brak: brak,
                    area: area, gates: gates, address: address,
                    pmRoutes: pmRoutes, mgRoutes: mgRoutes, 
                    storageType: storageType, storagePlaces: storagePlaces
                });
            });
        }
        callback(true);
    };

    const script = document.createElement('script');
    script.src = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?sheet=${encodeURIComponent(sheetName)}&tqx=responseHandler:${callbackName}`;
    document.body.appendChild(script);
}

function renderTabs() {
    const container = document.getElementById('tabsContainer');
    container.innerHTML = '';
    tabsList.forEach(function(tabId) {
        let count = tabId === 'Все склады' ? warehousesData.length : favorites.length;
        const btn = document.createElement('button');
        btn.className = `tab-button ${tabId === currentTab ? 'active' : ''}`;
        btn.innerHTML = `${tabId} <span class="tab-count">${count}</span>`;
        btn.onclick = function() {
            currentTab = tabId; clearSearch(false); renderTabs(); renderCards();
        };
        container.appendChild(btn);
    });
}

function highlightText(text, query) {
    if (!query || !text) return text || '';
    const escapedQuery = query.replace(/[-\/\\^$*+?.()|[\]{}]/g, '\\$&');
    const regex = new RegExp(`(${escapedQuery})`, 'gi');
    return text.replace(regex, '<mark class="highlight">$1</mark>');
}

function renderCards(filterQuery = '') {
    const container = document.getElementById('contentArea');
    container.innerHTML = '';
    const isSearching = filterQuery.length > 0;
    
    let filtered = warehousesData.filter(function(item) {
        if (isSearching) {
            const q = filterQuery.toLowerCase();
            return item.title.toLowerCase().includes(q) || 
                   item.whId.toLowerCase().includes(q) || 
                   item.address.toLowerCase().includes(q);
        }
        if (currentTab === 'Избранное') return favorites.includes(item.id);
        return true;
    });

    if (filtered.length === 0) {
        container.innerHTML = `
            <div class="empty-state">
                <span style="font-size:48px;">🔍</span>
                <h3>Склады не найдены</h3>
                <p>По вашему запросу нет данных.</p>
            </div>`;
        return;
    }

    filtered.forEach(function(wh) {
        const isFav = favorites.includes(wh.id);
        const displayTitle = highlightText(wh.title, filterQuery);
        const displayAddress = highlightText(wh.address, filterQuery);
        const displayId = highlightText(wh.whId, filterQuery);
        const mapUrl = `https://yandex.ru/maps/?text=${encodeURIComponent(wh.address)}`;

        let specsHtml = `
            <div class="spec-item"><span class="spec-label">Общая площадь ЛО</span><span class="spec-value">${wh.area}</span></div>
            <div class="spec-item"><span class="spec-label">Ворота (СГТ)</span><span class="spec-value">${wh.gates}</span></div>
        `;

        if (wh.pmRoutes && wh.pmRoutes !== 'NaN' && wh.pmRoutes !== 'null') {
            specsHtml += `<div class="spec-item"><span class="spec-label">Маршруты ПМ</span><span class="spec-value">${wh.pmRoutes}</span></div>`;
        }
        if (wh.mgRoutes && wh.mgRoutes !== 'NaN' && wh.mgRoutes !== 'null') {
            specsHtml += `<div class="spec-item"><span class="spec-label">Маршруты МГ</span><span class="spec-value">${wh.mgRoutes}</span></div>`;
        }
        if (wh.storageType && wh.storageType !== 'NaN' && wh.storageType !== 'null') {
            specsHtml += `<div class="spec-item" style="grid-column: 1 / -1;"><span class="spec-label">Тип хранения</span><span class="spec-value">${wh.storageType}</span></div>`;
        }
        if (wh.storagePlaces && wh.storagePlaces !== 'NaN' && wh.storagePlaces !== 'null') {
            specsHtml += `<div class="spec-item"><span class="spec-label">Кол-во мест</span><span class="spec-value">${wh.storagePlaces}</span></div>`;
        }

        const cardElement = document.createElement('div');
        cardElement.className = `card status-${wh.statusColor}`;
        cardElement.innerHTML = `
            <div class="card-header">
                <div class="card-title-group">
                    <span class="warehouse-id-badge">ID: ${displayId}</span>
                    <h3>${displayTitle}</h3>
                </div>
                <button class="fav-btn ${isFav ? 'active' : ''}" onclick="toggleFavorite(event, '${wh.id}')">${isFav ? '★' : '☆'}</button>
            </div>

            <div class="tags-row">
                ${wh.type !== '-' ? `<span class="tag">📦 ${wh.type}</span>` : ''}
                ${wh.ownership !== '-' ? `<span class="tag">🏢 ${wh.ownership}</span>` : ''}
                ${wh.fbo ? `<span class="tag tag-active">✅ ФБО</span>` : ''}
                ${wh.fbs ? `<span class="tag tag-active">✅ ФБС</span>` : ''}
                ${wh.brak ? `<span class="tag tag-warning">♻️ Брак</span>` : ''}
            </div>

            <div class="specs-grid">${specsHtml}</div>

            <div class="address-box"><span class="address-icon">📍</span><span>${displayAddress}</span></div>

            <div class="card-footer">
                <div class="status-badge"><span class="dot"></span> ${wh.statusText}</div>
                <a href="${mapUrl}" target="_blank" class="route-btn">Маршрут 🗺️</a>
            </div>
        `;
        container.appendChild(cardElement);
    });
}

function showToast(message) {
    const toast = document.getElementById('toast');
    toast.innerText = message; toast.classList.add('show');
    setTimeout(function() { toast.classList.remove('show'); }, 2500);
}

function toggleFavorite(event, id) {
    event.preventDefault(); event.stopPropagation();
    if (favorites.includes(id)) {
        favorites = favorites.filter(function(f) { return f !== id; });
        showToast('Удалено из избранного');
    } else {
        favorites.push(id); showToast('Добавлено в избранное');
    }
    localStorage.setItem('wb_wh_favorites_v3', JSON.stringify(favorites));
    renderTabs(); 
    renderCards(document.getElementById('searchInput').value.trim());
}

function initTheme() {
    const savedTheme = localStorage.getItem('theme');
    if (savedTheme) document.documentElement.setAttribute('data-theme', savedTheme);
    updateThemeIcon();
}

function updateThemeIcon() {
    document.getElementById('themeIcon').innerText = document.documentElement.getAttribute('data-theme') === 'light' ? '🌙' : '☀️';
}

function toggleTheme() {
    const newTheme = document.documentElement.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', newTheme);
    localStorage.setItem('theme', newTheme);
    updateThemeIcon();
}

function filterCards() {
    const query = document.getElementById('searchInput').value.trim();
    document.getElementById('clearSearchBtn').style.display = query.length > 0 ? 'flex' : 'none';
    renderCards(query);
}

function clearSearch(shouldRender = true) {
    document.getElementById('searchInput').value = '';
    document.getElementById('clearSearchBtn').style.display = 'none';
    if (shouldRender) renderCards();
}

async function shareApp() {
    try {
        const htmlContent = "<!DOCTYPE html>\n" + document.documentElement.outerHTML;
        const file = new File([new Blob([htmlContent], { type: "text/html" })], "Navigator_Warehouses.html", { type: "text/html" });
        if (navigator.canShare && navigator.canShare({ files: [file] })) {
            await navigator.share({ files: [file], title: 'Навигатор Складов', text: 'База данных складов.' });
        }
    } catch (e) { console.log(e); }
}
</script>
